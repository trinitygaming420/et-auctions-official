name: Build Production AAB

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Production AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Configure EAS project
        run: eas init --account eandtelectronics-724 --force --non-interactive

      - name: Build Production Android AAB
        run: eas build --platform android --profile production --non-interactive --wait
