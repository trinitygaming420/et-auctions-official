name: Build Second Phone APK

on:
  workflow_dispatch:

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Create second-phone test package
        run: |
          node -e "
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('app.json','utf8'));
          p.expo.name='E&T Auctions Test';
          p.expo.android.package='com.etelectronics.auctions.secondphone';
          p.expo.android.versionCode=3;
          fs.writeFileSync('app.json',JSON.stringify(p,null,2));
          "

      - name: Create Android project
        run: npx expo prebuild --platform android --clean
        env:
          CI: "1"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease
        env:
          NODE_ENV: production

      - name: Verify APK
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ET-Auctions-Second-Phone
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
